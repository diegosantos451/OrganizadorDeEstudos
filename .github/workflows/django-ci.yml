
name: Django CI

on:
  push:
    branches:
      - main
      - feature/revisao-tecnica
  pull_request:
    branches:
      - main

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar Django
        run: pip install Django==6.1.3

      - name: Verificar projeto
        run: python manage.py check

      - name: Executar testes automatizados
        run: python manage.py test tarefas
