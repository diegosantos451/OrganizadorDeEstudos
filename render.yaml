services:
  - type: web
    name: organizador-de-estudos
    runtime: python
    plan: free
    buildCommand: pip install -r deploy/requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /saude/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: organizador-db
          property: connectionString
databases:
  - name: organizador-db
    plan: free
